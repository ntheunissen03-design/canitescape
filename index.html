<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Can It Escape?</title>
<meta name="description" content="A ball, spinning rings, and a countdown. Tap to split it toward the gap. Can it escape?">
<style>
  :root { --bg:#09090b; --fg:#f5f5f7; --dim:rgba(245,245,247,.55); --accent:#3ddc97; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.5 -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:72px 24px; text-align:center; }
  .rings { width:220px; height:220px; margin:0 auto 40px; position:relative; }
  .rings i { position:absolute; inset:0; border-radius:50%; border:2px solid rgba(255,255,255,.75); clip-path: polygon(50% 50%, 100% 0, 100% 100%, 0 100%, 0 0, 40% 0); animation: spin 6s linear infinite; }
  .rings i:nth-child(2) { inset:28px; animation-duration:4.5s; animation-direction:reverse; }
  .rings i:nth-child(3) { inset:56px; border-color:var(--accent); animation-duration:3s; }
  .rings b { position:absolute; width:14px; height:14px; border-radius:50%; background:#fff; left:103px; top:103px; box-shadow:0 0 16px #fff; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size:44px; margin:0 0 8px; letter-spacing:-.5px; }
  p { color:var(--dim); margin:0 0 28px; }
  a { color:var(--fg); }
  footer { margin-top:64px; font-size:14px; color:var(--dim); }
</style>
</head>
<body>
<main>
  <div class="rings"><i></i><i></i><i></i><b></b></div>
  <h1>Can it escape?</h1>
  <p>A ball, spinning rings, and a countdown. Every bounce plays the next note. Tap to split it toward the gap, and break every ring before the clock runs out.</p>
  <p>Coming soon to the App Store.</p>
  <footer>Support: <a href="mailto:n.theunissen03@gmail.com">n.theunissen03@gmail.com</a> · <a href="privacy/">Privacy</a></footer>
</main>
</body>
</html>
